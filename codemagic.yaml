workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync iOS platform
        script: |
          if [ -d "dist" ]; then cp -r dist/* www/; fi
          npx cap sync ios
      - name: Build ipa
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination "generic/platform=iOS" archive -archivePath $HOME/Library/Developer/Xcode/Archives/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath $HOME/Library/Developer/Xcode/Archives/App.xcarchive -exportPath $HOME/output -exportOptionsPlist exportOptions.plist || true
    artifacts:
      - $HOME/output/*.ipa
      - ios/App/build/Debug-iphoneos/*.app
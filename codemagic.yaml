workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Update Capacitor iOS native project
        script: npx cap sync ios
    artifacts:
      - build/ios/ipa/*.ipa
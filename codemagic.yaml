workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Setup iOS Platform and Build
        script: |
          npx cap sync ios
          if [ -d "ios/App" ]; then
            cd ios/App
          elif [ -d "ios" ]; then
            cd ios
          fi
          if [ -d "Pods" ]; then
            pod install
          fi
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination "generic/platform=iOS" build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS" build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Debug-iphoneos/*.app
      - ios/build/Debug-iphoneos/*.app
      - build/ios/ipa/*.ipa
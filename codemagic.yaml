workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Ensure www directory exists and sync
        script: |
          if [ -d "dist" ]; then cp -r dist/* www/; fi
          npx cap sync ios
    artifacts:
      - ios/App/App.xcarchive
      - build/ios/ipa/*.ipa